services:
  db-casablanca:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SCRIPT_PATTERN=${SCRIPT_PATTERN:-./scripts-casablanca/*.sql} 
    
    image: oracle-casablanca-image
    
    container_name: oracle-casablanca
    environment:
      - ORACLE_PWD=OracleAdmin123!
    ports:
      - "1521:1521"
    volumes:
      - casablanca-data:/opt/oracle/oradata
    networks:
      - maroc-db-net

  db-rabat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SCRIPT_PATTERN=${SCRIPT_PATTERN:-./scripts-rabat/*.sql} 
    
    image: oracle-rabat-image
    
    container_name: oracle-rabat
    environment:
      - ORACLE_PWD=OracleAdmin123!
    ports:
      - "1521:1521"
    volumes:
      - rabat-data:/opt/oracle/oradata
    networks:
      - maroc-db-net

  db-marrakech:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SCRIPT_PATTERN=${SCRIPT_PATTERN:-./scripts-marrakech/*.sql} 
    
    image: oracle-marrakech-image
    
    container_name: oracle-marrakech
    environment:
      - ORACLE_PWD=OracleAdmin123!
    ports:
      - "1521:1521"
    volumes:
      - marrakech-data:/opt/oracle/oradata
    networks:
      - maroc-db-net

volumes:
  casablanca-data:
  rabat-data:
  marrakech-data:

networks:
  maroc-db-net:
    driver: bridge